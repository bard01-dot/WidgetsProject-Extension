<script> // general stuff
    
    let shortcutColor = "#715A5A";
    let shortcutIcon = `
    <svg viewBox="0 0 48 48" class="shortcutMenuIcon">
        <path d="M20 8h-12c-2.21 0-3.98 1.79-3.98 4l-.02 24c0 2.21 1.79 4 4 4h32c2.21 0 4-1.79 4-4v-20c0-2.21-1.79-4-4-4h-16l-4-4z"/>
        <path d="M0 0h48v48h-48z" fill="none"/>
    </svg>`; // folder icon

    //notification animation
    function showNotification(content) {
        const notification = document.getElementById('notification');
        notification.style.display = 'block';
        notification.classList.add('show');

        notification.innerHTML = content;

        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => {
                notification.style.display = 'none';
                
            }, 500); // Tiempo para la transición de desvanecimiento
        }, 2000); // Duración que la notificación permanece visible (2 segundos)
    }
    
    // close process
    function exitApp() {
        fetch('/exit', { method: 'POST' });
    }
    
    // open color picker
    function openColorPicker() {
       const picker = document.getElementById("colorPicker");
       
       // open native select
        picker.click();
            // define shortcut color pick
            picker.addEventListener('input', () => {
                document.getElementById("shortcutExampleText").style.color = picker.value;
                document.getElementById("shortcutExampleSVG").querySelector("svg").style.fill = picker.value;
                shortcutColor = picker.value;
        });
   }
    
   // choose shortcut icon
    function chooseShortcutIcon(element) {
       
        shortcutIcon = element.querySelector("svg").outerHTML;// obtain svg

        // replace
        document.getElementById("shortcutExampleSVG").innerHTML = shortcutIcon;

        let mysvg = document.getElementById("shortcutExampleSVG").querySelector("svg");

        // apply styles
        mysvg.style.width = "20px";
        mysvg.style.fill = document.getElementById("shortcutExampleText").style.color;
        mysvg.classList.add("shortcutMenuIcon");
        
        visibility("shortcutsCreateMenu");
    }

    // change panels visibility
    function visibility(toShow, me){
        var lista = ["homeMenu", "notesMenu", "shortcutsCreateMenu", "shortcutsMenu", "iconsMenu", "settingsMenu"];
        
        for (e of lista){
            document.getElementById(e).hidden = true;
        }
        document.getElementById(toShow).hidden = false;
    }
    
    // save setting
    function save(option){
        var url= "";
        var data = "";
        var name= "";


        if(option == "notes"){
            url = "notesAdd";
            data = document.getElementById("myNoteText").value;
        }
        else if(option == "shortcut"){
            url = "shortcutAdd";
            data = document.getElementById('shortcutDirectory').value;
            name  =  document.getElementById("shortcutName").value;
        }
        else if(option == "searchEngine"){
            url = "SearchEngine";
            data = document.getElementById('SearchEngine').value;
        }
        
        urlPost(url, data, name);
            
    }

    // post save setting
    async function urlPost(url, data, name) {
        try {
            const response = await fetch("http://127.0.0.1:5000/" + url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json',},
                body: JSON.stringify({ data: data, name: name, color: shortcutColor, icon: shortcutIcon}) // send option to open
            });
        } catch (error) {
            console.error('Error:', error);
        }
    }


    // search function
    function irAUrl() {
        let url = document.getElementById("searchInput").value.trim();
        
        if (url) {
            window.open(document.getElementById('SearchEngine').value + url, "_blank"); // open url
            window.close()
        }
    }

    // search engine inputs
    document.getElementById("SearchButton").addEventListener("click", irAUrl);
    document.getElementById("searchInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            irAUrl();
        }
    });


    /* document load */
    document.addEventListener("DOMContentLoaded", function() {
        // resize window
        const width = 500;
        const height = 360;
        //window.resizeTo(width, height);

        // define panel to open
        var panel = "{{ panel }}";  // Flask 
        if(panel == "searchEngine"){
            window.resizeTo(width, 120);
            document.getElementById("mainMenu").style.display = "none";

            document.getElementById("searchInput").focus();// focus input search
        }
        else{ 
            document.getElementById("searchEnginePanel").style.display = "none";
            visibility(panel); 
            window.resizeTo(width, height);
        }


        // center position
        const left = (screen.width - width) / 2;
        const top = (screen.height - height) / 2;
        window.moveTo(left, top);

        // update button
        const update = "{{ update }}" === "True";

        // true = latest version / false = isnt latest version
        if(update){
            document.getElementById("updateButton").style.display = "none";
        }
        else{
            //showNotification('New version is available')     
        }

        // define search engine
        document.getElementById("SearchEngine").value = "{{ browser }}";


        // define startup value
        var myStartupValue = "{{ startup }}";
        if (myStartupValue== "True"){myStartupValue = true;}else{myStartupValue=false;} // boolean()

        // update startup switch
        var sw = document.getElementById("startupSwitch");
        sw.value = myStartupValue;
        sw.checked = myStartupValue;


        // add event to startup switch
        document.getElementById("startupContainer").addEventListener("change", (e) => {
            urlPost("updateSetting", "startup", "0");
        });

        //showNotification('this is a test')
       
    });

<script>// Notes

var todoNotes = [];
const lista = document.getElementById('tasks');

async function refreshNotes() {
  try {
    const content = await fetch("http://127.0.0.1:5000/notes");
    todoNotes = await content.json();

    if (Array.isArray(todoNotes)) {
      updateNotesList(todoNotes);
    } else {
      console.error("Error: la respuesta no es un array válido");
    }
  } catch (e) {
    console.log("error at get notes\n" + e);
  }
}

// Render DOM
function updateNotesList(notes) {
  lista.innerHTML = ''; // clean list
  
  if (Array.isArray(notes)) {
    notes.forEach((note, index) => {
      if (note.text.trim() !== "") {
        lista.appendChild(createTask(note, index)); 
      }
    });
  } else {
    console.error('Error: la variable notes no es un array.');
  }
}


function createTask(note, idNota) {
  const task = document.createElement('li');
  task.classList.add('task');
  task.draggable = true;

  const color_1 = "#715A5A";
  const checkboxColor = note.checked ? `style="background-color: ${color_1}; border-color: ${color_1}"` : "";

  task.innerHTML = `
    <label class="custom-checkbox" style="display:flex;align-items:center;justify-content:space-between;color:${color_1};width:100%;">
      <div style="display:flex;align-items:center;gap:6px;margin-right:5px;width:100%">
          <input onclick="switchCheckBox(${idNota})" class="taskcheckbox" ${note.checked ? 'checked' : ''} hidden>
          <span class="checkmark" ${checkboxColor}></span>
          <span>${note.text}</span>
      </div>

      <svg viewBox="0 0 16 16" onclick="deleteNotes(${idNota})" style="width:15px;fill:${color_1};cursor:pointer;">
          <polygon points="8 9.414 3.707 13.707 2.293 12.293 6.586 8 2.293 3.707 
                          3.707 2.293 8 6.586 12.293 2.293 13.707 3.707 
                          9.414 8 13.707 12.293 12.293 13.707 8 9.414"/>
      </svg>
    </label>
  `;

  return task;
}

// delete note
async function deleteNotes(idNote) {
  try {
    await fetch("http://127.0.0.1:5000/deleteNote", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: idNote })
    });
    refreshNotes();
  } catch (err) {
    console.error('Error - delete Note', err);
  }
}

// checkbox
async function switchCheckBox(idNote) {
  try {
    await fetch("http://127.0.0.1:5000/changeCheckbox", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: idNote })
    });
    refreshNotes();
  } catch (err) {
    console.error('Error - change Checkbox', err);
  }
}


// DRAG & DROP
let draggingEl = null;

lista.addEventListener('dragstart', e => {
  if (e.target.matches('.task')) {
    draggingEl = e.target;
    e.target.classList.add('dragging');
  }
});

lista.addEventListener('dragend', e => {
  if (e.target.matches('.task')) {
    e.target.classList.remove('dragging');
    draggingEl = null;
    actualizarIds();
    guardarNuevoOrden(); // important -> update json
  }
});

lista.addEventListener('dragover', e => {
  e.preventDefault();
  const afterElement = getDragAfterElement(lista, e.clientY);
  const dragging = document.querySelector('.dragging');
  if (!dragging) return;
  if (afterElement == null) {
    lista.appendChild(dragging);
  } else {
    lista.insertBefore(dragging, afterElement);
  }
});

function getDragAfterElement(container, y) {
  const draggableElements = [...container.querySelectorAll('.task:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

//  Reasign idNota 
function actualizarIds() {
  const tasks = lista.querySelectorAll('.task');
  
  tasks.forEach((task, index) => {
    const idNota = index; // ← ahora empieza desde 0
    const input = task.querySelector('input.taskcheckbox');
    const svg = task.querySelector('svg');

    // Actualizar los eventos con el nuevo id
    input.setAttribute('onclick', `switchCheckBox(${idNota})`);
    svg.setAttribute('onclick', `deleteNotes(${idNota})`);
  });
}

// refresh content | save new order
async function guardarNuevoOrden() {
  const texts = [...lista.querySelectorAll('.task span:last-child')].map(span => span.textContent);
  try {
    await fetch("http://127.0.0.1:5000/updateNotesOrder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order: texts })
    });
  } catch (err) {
    console.warn("Error at save order", err);
  }
}

// Inicializa
refreshNotes();
</script>
